name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - name: Run tests
      env:
        # For the pipeline, we provide a dummy secret so the tests pass,
        # or we could use GitHub secrets: ${{ secrets.MY_SECRET_KEY }}
        MY_SECRET_KEY: "dummy_ci_secret_value"
      run: |
        pytest
